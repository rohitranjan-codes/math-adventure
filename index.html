<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Learning Adventure • Lern-Abenteuer</title>
<style>
  :root {
    --bg1: #7dd3fc;
    --bg2: #c4b5fd;
    --card: #ffffff;
    --ink: #1f2937;
    --good: #22c55e;
    --bad: #f97316;
    --accent: #6366f1;
    --der: #3b82f6;   /* blue  */
    --die: #ec4899;   /* pink  */
    --das: #22c55e;   /* green */
    --shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--ink);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    width: 100%;
    max-width: 620px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .title {
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.15);
    line-height: 1.1;
    flex: 1;
  }
  .top-btns { display: flex; gap: 8px; }
  .pill {
    border: none;
    background: #fff;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 160px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .pill:active { transform: scale(.94); }

  /* ---------- Score row ---------- */
  .scorebar {
    width: 100%;
    max-width: 620px;
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chip {
    flex: 1;
    background: rgba(255,255,255,.85);
    border-radius: 16px;
    padding: 8px 10px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .chip .label { font-size: 12px; opacity: .7; display:block; }
  .chip .value { font-size: 22px; font-weight: 800; }

  /* ---------- Card ---------- */
  .card {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border-radius: 26px;
    padding: 22px;
    box-shadow: var(--shadow);
    text-align: center;
  }

  .tab-row, .mode-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tab-btn {
    border: 3px solid transparent;
    background: #f5f3ff;
    color: var(--accent);
    border-radius: 16px;
    padding: 10px 18px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }
  .tab-btn.active { border-color: var(--accent); background: #ede9fe; }

  .mode-btn {
    border: 3px solid transparent;
    background: #eef2ff;
    color: var(--accent);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .mode-btn.active { border-color: var(--accent); background: #e0e7ff; }

  .visual {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    min-height: 60px;
    margin: 6px 0 6px;
    font-size: clamp(22px, 6vw, 34px);
    line-height: 1.2;
  }
  .visual .row { letter-spacing: 2px; }
  .visual .op { font-weight: 800; color: var(--accent); }
  .visual .bigemoji { font-size: clamp(52px, 16vw, 92px); }

  .question {
    font-size: clamp(30px, 9vw, 52px);
    font-weight: 800;
    margin: 4px 0 2px;
    letter-spacing: 2px;
  }
  .hint {
    font-size: 16px;
    color: #64748b;
    font-weight: 700;
    min-height: 20px;
    margin-bottom: 4px;
  }

  .answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  .answer {
    border: none;
    background: #f1f5f9;
    border-radius: 18px;
    padding: 18px 0;
    font-size: 28px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 0 #cbd5e1;
    transition: transform .08s;
  }
  .answer:active { transform: translateY(3px); box-shadow: 0 1px 0 #cbd5e1; }
  .answer.correct { background: var(--good); color:#fff; box-shadow: 0 4px 0 #15803d; }
  .answer.wrong { background: var(--bad); color:#fff; box-shadow: 0 4px 0 #c2410c; }
  .answer:disabled { cursor: default; }

  .feedback {
    margin-top: 16px;
    font-size: 22px;
    font-weight: 800;
    min-height: 30px;
    color: var(--accent);
  }
  .next-btn {
    margin-top: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 16px;
    padding: 12px 26px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 0 #4338ca;
    display: none;
  }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4338ca; }

  .stars { font-size: 26px; min-height: 32px; margin-top: 6px; letter-spacing: 2px; }

  .progress {
    font-size: 14px;
    font-weight: 700;
    color: #64748b;
    margin-bottom: 8px;
    letter-spacing: 1px;
    min-height: 18px;
  }
  /* confetti + celebration */
  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .confetti span { position: absolute; top: -8%; will-change: transform; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); opacity: .8; } }
  #celebStars { font-size: 40px; letter-spacing: 6px; margin: 6px 0; }
  #celebMsg { font-size: 20px; font-weight: 700; color: var(--ink); }

  /* ---------- Recent plays ---------- */
  .recent {
    width: 100%;
    max-width: 620px;
    background: rgba(255,255,255,.85);
    border-radius: 20px;
    padding: 14px 18px;
    margin-top: 14px;
    box-shadow: var(--shadow);
  }
  .recent h3 { margin: 0 0 8px; font-size: 16px; }
  .play-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-top: 1px dashed #e2e8f0;
    font-size: 14px;
  }
  .play-row:first-of-type { border-top: none; }
  .play-left { display: flex; align-items: center; gap: 8px; }
  .play-score { font-weight: 800; }
  .empty { color: #64748b; font-size: 14px; }

  .footer {
    margin-top: 14px;
    color: #fff;
    opacity: .85;
    font-size: 13px;
    text-align: center;
  }

  /* ---------- Login overlay ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(30,27,75,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.hidden { display: none; }
  .login-card {
    position: relative;
    z-index: 1;
    background: #fff;
    border-radius: 26px;
    padding: 26px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .login-card h2 { margin: 0 0 6px; font-size: 24px; }
  .login-card p { margin: 0 0 16px; color: #64748b; }
  .name-input {
    width: 100%;
    border: 3px solid #e0e7ff;
    border-radius: 16px;
    padding: 14px;
    font-size: 20px;
    text-align: center;
    font-family: inherit;
    margin-bottom: 12px;
    outline: none;
  }
  .name-input:focus { border-color: var(--accent); }
  .start-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 16px;
    padding: 14px 30px;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 0 #4338ca;
    width: 100%;
  }
  .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #4338ca; }
  .players-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .player-chip {
    border: 2px solid #e0e7ff;
    background: #f5f3ff;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: var(--accent);
  }
  .player-chip:active { transform: scale(.94); }

  @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
  .pop { animation: pop .25s ease; }
</style>
</head>
<body>
  <!-- Login overlay -->
  <div class="overlay" id="overlay">
    <div class="login-card">
      <div style="font-size:46px">🎒</div>
      <h2 id="loginTitle">Learning Adventure</h2>
      <p id="namePrompt">What's your name?</p>
      <div class="players-list" id="playersList"></div>
      <input class="name-input" id="nameInput" maxlength="14" placeholder="..." autocomplete="off" />
      <button class="start-btn" id="startBtn">Start ▶️</button>
    </div>
  </div>

  <!-- Celebration overlay -->
  <div class="overlay hidden" id="celebrate">
    <div class="confetti" id="confetti"></div>
    <div class="login-card">
      <div id="celebEmoji" style="font-size:56px">🏆</div>
      <h2 id="celebTitle">Round complete!</h2>
      <div id="celebStars">⭐⭐⭐</div>
      <p id="celebMsg"></p>
      <button class="start-btn" id="againBtn">Play again ▶️</button>
    </div>
  </div>

  <div class="topbar">
    <div class="title" id="title">Learning Adventure</div>
    <div class="top-btns">
      <button class="pill" id="playerBtn" title="Switch player">👤 <span id="playerName">—</span></button>
      <button class="pill" id="langBtn" title="Switch language">
        <span id="langFlag">🇬🇧</span><span id="langText">EN</span>
      </button>
    </div>
  </div>

  <div class="scorebar">
    <div class="chip"><span class="label" id="lblScore">Score</span><span class="value" id="score">0</span></div>
    <div class="chip"><span class="label" id="lblStreak">Streak</span><span class="value" id="streak">0</span></div>
    <div class="chip"><span class="label" id="lblBest">Best</span><span class="value" id="best">0</span></div>
  </div>

  <div class="card">
    <div class="tab-row" id="tabRow">
      <button class="tab-btn active" data-act="math">🧮 <span id="tMath">Math</span></button>
      <button class="tab-btn" data-act="article">🔤 <span id="tArt">Articles</span></button>
    </div>

    <div class="mode-row" id="modeRow">
      <button class="mode-btn active" data-mode="add">➕ <span id="mAdd">Add</span></button>
      <button class="mode-btn" data-mode="sub">➖ <span id="mSub">Subtract</span></button>
      <button class="mode-btn" data-mode="mix">🎲 <span id="mMix">Both</span></button>
    </div>

    <div class="progress" id="progress"></div>
    <div class="visual" id="visual"></div>
    <div class="question" id="question"></div>
    <div class="hint" id="hint"></div>

    <div class="answers" id="answers"></div>

    <div class="feedback" id="feedback"></div>
    <div class="stars" id="stars"></div>
    <button class="next-btn" id="nextBtn">Next ➡️</button>
  </div>

  <div class="recent" id="recent">
    <h3 id="recentTitle">Recent plays</h3>
    <div id="playsBox"></div>
  </div>

  <div class="footer" id="footer">Made with ❤️ for learning • Mit ❤️ zum Lernen</div>

<script>
/* ================= Translations ================= */
const T = {
  en: {
    flag: "🇬🇧", code: "EN", title: "Learning Adventure",
    score: "Score", streak: "Streak", best: "Best",
    tMath: "Math", tArt: "Articles",
    add: "Add", sub: "Subtract", mix: "Both",
    right: ["Great job! 🎉","Correct! ⭐","Awesome! 🚀","You did it! 👏","Super! 🌟"],
    wrong: "Almost! The answer is ",
    next: "Next ➡️",
    footer: "Made with ❤️ for learning",
    chooseArticle: "Choose: a or an?",
    namePrompt: "What's your name?",
    start: "Start ▶️",
    recent: "Recent plays",
    noPlays: "No plays yet — let's start! 🎈",
    switchP: "Switch player",
    progress: "Question {x} / {n}",
    celeb: {
      title: "Round complete!",
      perfect: "Perfect! You got them all! 🏆",
      great: "Well done! 🎉",
      ok: "Good try — keep going! 💪",
      score: "You got {c} of {n} right!",
      again: "Play again ▶️",
      see: "See results 🎉"
    },
    htmlLang: "en", locale: "en-GB",
    actLabel: { math: "Math 🧮", article: "Articles 🔤" }
  },
  de: {
    flag: "🇩🇪", code: "DE", title: "Lern-Abenteuer",
    score: "Punkte", streak: "Serie", best: "Beste",
    tMath: "Rechnen", tArt: "Artikel",
    add: "Plus", sub: "Minus", mix: "Beides",
    right: ["Sehr gut! 🎉","Richtig! ⭐","Toll gemacht! 🚀","Geschafft! 👏","Super! 🌟"],
    wrong: "Fast! Die Antwort ist ",
    next: "Weiter ➡️",
    footer: "Mit ❤️ zum Lernen gemacht",
    chooseArticle: "Wähle: der, die oder das?",
    namePrompt: "Wie heißt du?",
    start: "Los ▶️",
    recent: "Letzte Spiele",
    noPlays: "Noch keine Spiele — los geht's! 🎈",
    switchP: "Spieler wechseln",
    progress: "Frage {x} / {n}",
    celeb: {
      title: "Runde geschafft!",
      perfect: "Perfekt! Alles richtig! 🏆",
      great: "Gut gemacht! 🎉",
      ok: "Gut versucht — weiter so! 💪",
      score: "Du hast {c} von {n} richtig!",
      again: "Nochmal spielen ▶️",
      see: "Ergebnis zeigen 🎉"
    },
    htmlLang: "de", locale: "de-DE",
    actLabel: { math: "Rechnen 🧮", article: "Artikel 🔤" }
  }
};

/* ================= Word data ================= */
// German nouns with correct article + English meaning
const NOUNS_DE = [
  {w:"Hund", a:"der", tr:"dog", e:"🐕"},   {w:"Katze", a:"die", tr:"cat", e:"🐈"},
  {w:"Haus", a:"das", tr:"house", e:"🏠"}, {w:"Ball", a:"der", tr:"ball", e:"⚽"},
  {w:"Sonne", a:"die", tr:"sun", e:"☀️"},  {w:"Auto", a:"das", tr:"car", e:"🚗"},
  {w:"Baum", a:"der", tr:"tree", e:"🌳"},  {w:"Blume", a:"die", tr:"flower", e:"🌸"},
  {w:"Buch", a:"das", tr:"book", e:"📖"},  {w:"Apfel", a:"der", tr:"apple", e:"🍎"},
  {w:"Banane", a:"die", tr:"banana", e:"🍌"}, {w:"Kind", a:"das", tr:"child", e:"🧒"},
  {w:"Fisch", a:"der", tr:"fish", e:"🐟"}, {w:"Maus", a:"die", tr:"mouse", e:"🐭"},
  {w:"Ei", a:"das", tr:"egg", e:"🥚"},     {w:"Mond", a:"der", tr:"moon", e:"🌙"},
  {w:"Milch", a:"die", tr:"milk", e:"🥛"}, {w:"Wasser", a:"das", tr:"water", e:"💧"},
  {w:"Stern", a:"der", tr:"star", e:"⭐"}, {w:"Tür", a:"die", tr:"door", e:"🚪"},
  {w:"Bett", a:"das", tr:"bed", e:"🛏️"},  {w:"Vogel", a:"der", tr:"bird", e:"🐦"},
  {w:"Uhr", a:"die", tr:"clock", e:"🕐"},  {w:"Herz", a:"das", tr:"heart", e:"❤️"}
];
// English nouns needing a / an, with German meaning
const NOUNS_EN = [
  {w:"apple", a:"an", tr:"Apfel", e:"🍎"},   {w:"dog", a:"a", tr:"Hund", e:"🐕"},
  {w:"egg", a:"an", tr:"Ei", e:"🥚"},        {w:"ball", a:"a", tr:"Ball", e:"⚽"},
  {w:"orange", a:"an", tr:"Orange", e:"🍊"}, {w:"cat", a:"a", tr:"Katze", e:"🐈"},
  {w:"umbrella", a:"an", tr:"Regenschirm", e:"☂️"}, {w:"house", a:"a", tr:"Haus", e:"🏠"},
  {w:"elephant", a:"an", tr:"Elefant", e:"🐘"}, {w:"car", a:"a", tr:"Auto", e:"🚗"},
  {w:"ant", a:"an", tr:"Ameise", e:"🐜"},    {w:"tree", a:"a", tr:"Baum", e:"🌳"},
  {w:"owl", a:"an", tr:"Eule", e:"🦉"},      {w:"book", a:"a", tr:"Buch", e:"📖"},
  {w:"octopus", a:"an", tr:"Krake", e:"🐙"}, {w:"fish", a:"a", tr:"Fisch", e:"🐟"},
  {w:"star", a:"a", tr:"Stern", e:"⭐"},     {w:"igloo", a:"an", tr:"Iglu", e:"🛖"}
];

/* ================= State ================= */
const ROUND_LEN = 5;            // questions per round
let lang = localStorage.getItem("gameLang") || "en";
let activity = "math";          // "math" | "article"
let mode = "add";
let score = 0, streak = 0;
let current = null;             // { answer, options, ... }
let locked = false;
let roundOver = false;
let session = null;             // { id, activity, correct, total }

/* Player database (localStorage) */
let DB = loadDB();
function loadDB() {
  try { return JSON.parse(localStorage.getItem("gameDB")) || { players: {}, current: null }; }
  catch (e) { return { players: {}, current: null }; }
}
function saveDB() { localStorage.setItem("gameDB", JSON.stringify(DB)); }
function player() { return DB.players[DB.current]; }

/* ================= Elements ================= */
const el = id => document.getElementById(id);
const visualEl = el("visual"), questionEl = el("question"), hintEl = el("hint"),
      answersEl = el("answers"), feedbackEl = el("feedback"), starsEl = el("stars"),
      nextBtn = el("nextBtn");

/* ================= Sound ================= */
let actx = null;
function beep(freqs, dur = 0.14) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(actx.destination);
      const start = t + i * dur;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.start(start); o.stop(start + dur);
    });
  } catch (e) {}
}
const happySound = () => beep([523, 659, 784]);
const oopsSound  = () => beep([311, 247]);
const fanfare    = () => beep([523, 659, 784, 1047, 1319], 0.16);

/* ================= Helpers ================= */
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const shuffle = arr => arr.sort(() => Math.random() - 0.5);
const pick = arr => arr[rand(0, arr.length - 1)];
const EMOJIS = ["🍎","🍌","⭐","🐢","🦋","🌸","🚗","🐟","🎈","🍓","🐝","🍪"];

/* ================= Question builders ================= */
function buildMath() {
  let op = mode === "mix" ? (Math.random() < 0.5 ? "add" : "sub") : mode;
  let a, b, answer;
  if (op === "add") { a = rand(1, 10); b = rand(1, 10); answer = a + b; }
  else { a = rand(2, 12); b = rand(1, a); answer = a - b; }

  const sign = op === "add" ? "+" : "−";
  const icon = pick(EMOJIS);
  visualEl.innerHTML =
    `<div class="row">${icon.repeat(a)}</div>` +
    `<div class="op">${sign}</div>` +
    `<div class="row">${icon.repeat(b)}</div>`;
  questionEl.textContent = `${a} ${sign} ${b} = ?`;
  hintEl.textContent = "";

  const set = new Set([answer]);
  while (set.size < 4) {
    let cand = answer + rand(-3, 3);
    if (cand >= 0 && cand !== answer) set.add(cand);
  }
  return { answer: String(answer), options: shuffle([...set]).map(String) };
}

function buildArticle() {
  const t = T[lang];
  const data = lang === "de" ? NOUNS_DE : NOUNS_EN;
  const item = pick(data);

  visualEl.innerHTML = `<div class="bigemoji">${item.e}</div>`;
  questionEl.innerHTML = `<span style="color:#94a3b8">___</span> ${item.w}`;
  hintEl.textContent = `= ${item.tr}`;           // translation as a learning hint

  const options = lang === "de" ? ["der", "die", "das"] : ["a", "an"];
  return { answer: item.a, options };
}

/* ================= Rounds ================= */
function ensureSession() {
  if (!session || session.activity !== activity) {
    session = { id: Date.now() + "-" + Math.floor(Math.random() * 1000), activity, correct: 0, total: 0 };
    score = 0; streak = 0;
    renderRecent();
  }
}

function newRound() {
  ensureSession();
  locked = false;

  const t = T[lang];
  current = activity === "math" ? buildMath() : buildArticle();

  answersEl.innerHTML = "";
  answersEl.style.gridTemplateColumns = `repeat(${Math.min(current.options.length, 2) === 1 ? 1 : (current.options.length === 3 ? 3 : 2)}, 1fr)`;
  current.options.forEach(val => {
    const b = document.createElement("button");
    b.className = "answer pop";
    b.textContent = val;
    b.onclick = () => choose(b, val);
    answersEl.appendChild(b);
  });

  hintEl.style.visibility = activity === "article" ? "visible" : "hidden";
  if (activity === "math") { /* hint already blanked */ }
  else { questionEl.style.letterSpacing = "1px"; }

  feedbackEl.textContent = "";
  starsEl.textContent = "";
  nextBtn.style.display = "none";
  nextBtn.textContent = t.next;
  roundOver = false;
  updateProgress();
  updateScore();
}

function updateProgress() {
  if (!session) { el("progress").textContent = ""; return; }
  const x = Math.min(session.total + 1, ROUND_LEN);
  el("progress").textContent = T[lang].progress.replace("{x}", x).replace("{n}", ROUND_LEN);
}

function choose(btn, val) {
  if (locked) return;
  locked = true;
  const t = T[lang];
  const buttons = [...answersEl.children];

  session.total++;
  const correct = String(val) === String(current.answer);
  if (correct) {
    btn.classList.add("correct");
    score++; streak++; session.correct++;
    const p = player();
    if (streak > p.best) p.best = streak;
    feedbackEl.textContent = pick(t.right);
    starsEl.textContent = "⭐".repeat(Math.min(streak, 5));
    happySound();
  } else {
    btn.classList.add("wrong");
    streak = 0;
    feedbackEl.textContent = t.wrong + current.answer;
    buttons.forEach(b => { if (b.textContent === String(current.answer)) b.classList.add("correct"); });
    oopsSound();
  }
  buttons.forEach(b => b.disabled = true);

  // persist session into player history (entry is created on first answer)
  const pp = player();
  let entry = pp.history.find(h => h.id === session.id);
  if (!entry) {
    entry = { id: session.id, activity: session.activity, correct: 0, total: 0, ts: Date.now() };
    pp.history.unshift(entry);
    pp.history = pp.history.slice(0, 8);
  }
  entry.correct = session.correct; entry.total = session.total; entry.ts = Date.now();
  saveDB();

  updateScore();
  renderRecent();

  if (session.total >= ROUND_LEN) { roundOver = true; nextBtn.textContent = t.celeb.see; }
  nextBtn.style.display = "inline-block";
}

/* ================= Celebration ================= */
function advance() { if (roundOver) celebrate(); else newRound(); }

function launchConfetti() {
  const c = el("confetti");
  c.innerHTML = "";
  const pieces = ["🎉","⭐","🎊","🌟","🎈","✨","🍭"];
  for (let i = 0; i < 42; i++) {
    const s = document.createElement("span");
    s.textContent = pick(pieces);
    s.style.left = (Math.random() * 100) + "%";
    s.style.fontSize = (16 + Math.random() * 22) + "px";
    s.style.animationDuration = (2 + Math.random() * 2.2) + "s";
    s.style.animationDelay = (Math.random() * 0.6) + "s";
    c.appendChild(s);
  }
}

function renderCeleb() {
  const t = T[lang];
  const correct = session.correct, total = session.total || ROUND_LEN;
  const ratio = total ? correct / total : 0;
  let stars, msg, emoji;
  if (ratio >= 1)        { stars = 3; emoji = "🏆"; msg = t.celeb.perfect; }
  else if (ratio >= 0.6) { stars = 2; emoji = "🎉"; msg = t.celeb.great; }
  else                   { stars = 1; emoji = "💪"; msg = t.celeb.ok; }
  el("celebEmoji").textContent = emoji;
  el("celebTitle").textContent = t.celeb.title;
  el("celebStars").textContent = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  el("celebMsg").innerHTML = msg + "<br>" + t.celeb.score.replace("{c}", correct).replace("{n}", total);
  el("againBtn").textContent = t.celeb.again;
}

function celebrate() {
  renderCeleb();
  launchConfetti();
  fanfare();
  el("celebrate").classList.remove("hidden");
}

function playAgain() {
  el("celebrate").classList.add("hidden");
  el("confetti").innerHTML = "";
  roundOver = false;
  session = null;              // start a brand-new round
  newRound();
}
el("againBtn").onclick = playAgain;

function updateScore() {
  el("score").textContent = score;
  el("streak").textContent = streak;
  el("best").textContent = player() ? player().best : 0;
}

/* ================= Recent plays ================= */
function renderRecent() {
  const t = T[lang];
  const box = el("playsBox");
  const p = player();
  const plays = p ? p.history.filter(h => h.total > 0) : [];
  if (!plays.length) { box.innerHTML = `<div class="empty">${t.noPlays}</div>`; return; }
  box.innerHTML = plays.map(h => {
    const label = t.actLabel[h.activity] || h.activity;
    const when = new Date(h.ts).toLocaleString(t.locale, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="play-row">
      <div class="play-left"><span>${label}</span><span style="color:#94a3b8">${when}</span></div>
      <div class="play-score">${h.correct}/${h.total}</div>
    </div>`;
  }).join("");
}

/* ================= Language ================= */
function applyLang() {
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  el("title").textContent = t.title;
  el("loginTitle").textContent = t.title;
  el("langFlag").textContent = t.flag;
  el("langText").textContent = t.code;
  el("lblScore").textContent = t.score;
  el("lblStreak").textContent = t.streak;
  el("lblBest").textContent = t.best;
  el("tMath").textContent = t.tMath;
  el("tArt").textContent = t.tArt;
  el("mAdd").textContent = t.add;
  el("mSub").textContent = t.sub;
  el("mMix").textContent = t.mix;
  nextBtn.textContent = roundOver ? t.celeb.see : t.next;
  el("footer").textContent = t.footer;
  el("namePrompt").textContent = t.namePrompt;
  el("startBtn").textContent = t.start;
  el("recentTitle").textContent = t.recent;
  el("playerBtn").title = t.switchP;
  updateProgress();
  if (!el("celebrate").classList.contains("hidden") && session) renderCeleb();
}

el("langBtn").onclick = () => {
  lang = lang === "en" ? "de" : "en";
  localStorage.setItem("gameLang", lang);
  applyLang();
  renderRecent();
  if (activity === "article") { session = null; newRound(); }  // switch word set
};

/* ================= Tabs & modes ================= */
el("tabRow").addEventListener("click", e => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  activity = btn.dataset.act;
  [...el("tabRow").children].forEach(b => b.classList.toggle("active", b === btn));
  el("modeRow").style.display = activity === "math" ? "flex" : "none";
  session = null;   // start a fresh session for the new activity
  newRound();
});

el("modeRow").addEventListener("click", e => {
  const btn = e.target.closest(".mode-btn");
  if (!btn) return;
  mode = btn.dataset.mode;
  [...el("modeRow").children].forEach(b => b.classList.toggle("active", b === btn));
  newRound();
});

nextBtn.onclick = advance;

document.addEventListener("keydown", e => {
  if (!el("overlay").classList.contains("hidden")) return;   // login open
  if (!el("celebrate").classList.contains("hidden")) {        // celebration open
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playAgain(); }
    return;
  }
  const n = Number(e.key);
  if (n >= 1 && n <= answersEl.children.length) {
    const b = answersEl.children[n - 1];
    if (b && !b.disabled) b.click();
  } else if ((e.key === "Enter" || e.key === " ") && nextBtn.style.display !== "none") {
    advance();
  }
});

/* ================= Login / players ================= */
function openLogin() {
  const t = T[lang];
  const list = el("playersList");
  const names = Object.keys(DB.players);
  list.innerHTML = names.map(n =>
    `<button class="player-chip" data-name="${n.replace(/"/g,'&quot;')}">👤 ${n} · ⭐${DB.players[n].best}</button>`
  ).join("");
  list.querySelectorAll(".player-chip").forEach(b =>
    b.onclick = () => startPlayer(b.dataset.name));
  el("nameInput").value = "";
  el("overlay").classList.remove("hidden");
  setTimeout(() => el("nameInput").focus(), 50);
}

function startPlayer(name) {
  name = (name || "").trim().slice(0, 14);
  if (!name) return;
  if (!DB.players[name]) DB.players[name] = { best: 0, history: [] };
  DB.current = name;
  saveDB();
  el("playerName").textContent = name;
  el("overlay").classList.add("hidden");
  session = null;
  updateScore();
  renderRecent();
  newRound();
}

el("startBtn").onclick = () => startPlayer(el("nameInput").value);
el("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") startPlayer(el("nameInput").value); });
el("playerBtn").onclick = openLogin;

/* ================= Start ================= */
applyLang();
if (DB.current && DB.players[DB.current]) {
  el("playerName").textContent = DB.current;
  el("overlay").classList.add("hidden");
  updateScore();
  renderRecent();
  newRound();
} else {
  renderRecent();
  openLogin();
}
</script>
</body>
