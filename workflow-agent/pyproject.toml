[project]
name = "bizagent"
version = "0.1.0"
description = "An AI agent that runs the day-to-day workflow of a small business: customers, tasks, invoices, appointments and follow-ups."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bizagent = "bizagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bizagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
